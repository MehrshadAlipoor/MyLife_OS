# Life-OS Telegram assistant (Cloudflare Workers, free plan). Setup: README.md
# Secrets (npx wrangler secret put <NAME>):
#   TELEGRAM_BOT_TOKEN, OWNER_ID, WEBHOOK_SECRET, DEEPSEEK_API_KEY, GITHUB_TOKEN
#   ANTHROPIC_API_KEY (only when PROVIDER = "claude")
name = "life-os-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "life_os"
database_id = "d4d1537e-1416-46f5-90cf-dd18d708ef27"
migrations_dir = "migrations"

[[queues.producers]]
binding = "QUEUE"
queue = "life-os-inbox"

[[queues.consumers]]
queue = "life-os-inbox"
max_batch_size = 10
max_batch_timeout = 2
max_retries = 1
max_concurrency = 1
dead_letter_queue = "life-os-dlq"

[[queues.consumers]]
queue = "life-os-dlq"
max_batch_size = 10
max_retries = 0

[ai]
binding = "AI"
remote = true

[vars]
TIMEZONE = "Europe/Rome"
# Who answers: "deepseek" (chat, photos and routines on DeepSeek) or "claude" (Claude, with DeepSeek
# offered only as a fallback you approve per message). Change it and `npx wrangler deploy`.
PROVIDER = "deepseek"
# Used when PROVIDER = "claude"
CHAT_MODEL = "claude-haiku-5-5"
ROUTINE_MODEL = "claude-opus-5-5"
# Used when PROVIDER = "deepseek" (DEEPSEEK_MODEL is also the Claude fallback). Flash reads images; Pro doesn't.
DEEPSEEK_MODEL = "deepseek-flash"
DEEPSEEK_ROUTINE_MODEL = "deepseek-v4-pro"
MONTHLY_CAP_USD = "40"
VAULT_REPO = "MehrshadAlipoor/myBlog1"
VAULT_BRANCH = "main"
BACKUP_REPO = "MehrshadAlipoor/MyLife_OS"
BACKUP_BRANCH = "backups"
